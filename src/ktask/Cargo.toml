[package]
name = "ktask"
version = "0.1.0"
edition = "2024"

[features]
default = []
multi_threaded = ["dep:async-channel", "dep:concurrent-queue"]

[[example]]
name = "busy_behavior"
path = "example/busy_behavior.rs"

[[example]]
name = "idle_behavior"
path = "example/idle_behavior.rs"

[dependencies]
async-task = "4.7.1"
async-executor = "1.11"
async-channel = { version = "2.3.0", optional = true }
concurrent-queue = { version = "2.0.0", optional = true }
derive_more = { version = "2", default-features = false, features = ["deref", "deref_mut"] }
futures-lite = "2.6.1"

[dev-dependencies]
async-channel = "2.3.0"
