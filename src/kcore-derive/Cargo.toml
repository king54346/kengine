[package]
name = "kcore-derive"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
darling = "0.24.0"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0"
convert_case = "0.11.0"
fxhash = "0.2.1"

# 文档示例需要真正展开这些宏，因此回头依赖 kcore。
# dev-dependencies 不参与 lib 构建图，Cargo 允许这种回环。
[dev-dependencies]
kcore = { path = "../kcore" }
