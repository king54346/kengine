[package]
name = "kscene"
version = "0.1.0"
edition = "2024"

[dependencies]
kanim = { path = "../kanim" }
kasset = { path = "../kasset" }
kaudio = { path = "../kaudio" }
kcamera = { path = "../kcamera" }
kcore = { path = "../kcore" }
kgltf = { path = "../kgltf" }
klog = { path = "../klog" }
klight = { path = "../klight" }
kmaterial = { path = "../kmaterial" }
kmath = { path = "../kmath" }
kmesh = { path = "../kmesh" }
kparticle = { path = "../kparticle" }
kphysics = { path = "../kphysics" }
kpbr = { path = "../kpbr" }
# 剔除分片并行要用线程池，因此必须开多线程实现。
ktask = { path = "../ktask", features = ["multi_threaded"] }
fxhash = "0.2.1"

[dev-dependencies]
# 用 assets/Soldier.glb 做骨骼动画的集成测试，加载器要走资源管理器。
kasset = { path = "../kasset" }
ktask = { path = "../ktask", features = ["multi_threaded"] }
