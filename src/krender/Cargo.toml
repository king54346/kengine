[package]
name = "krender"
version = "0.1.0"
edition = "2024"

[dependencies]
kcamera = { path = "../kcamera" }
kcore = { path = "../kcore" }
kgizmo = { path = "../kgizmo" }
klog = { path = "../klog" }
klight = { path = "../klight" }
kmaterial = { path = "../kmaterial" }
kmath = { path = "../kmath" }
kmesh = { path = "../kmesh" }
kparticle = { path = "../kparticle" }
kpbr = { path = "../kpbr" }
kscene = { path = "../kscene" }
ksprite = { path = "../ksprite" }
ktexture = { path = "../ktexture" }
kui = { path = "../kui" }
# 自定义材质着色器要在交给 wgpu 之前先自己校验一遍——
# wgpu 的校验失败会直接 panic 掉整个进程，而用户写错着色器是常态。
kshader = { path = "../kshader" }
bytemuck = { version = "1.25.2", features = ["derive"] }
# 每帧要按网格/贴图查几万次缓存，标准库默认的 SipHash 在这里太重。
fxhash = "0.2"
wgpu = "30.0.0"
# 只用到窗口句柄，用于创建 surface。
winit = "0.30.13"

[dev-dependencies]
# 测试里解析 WGSL，核对着色器入口与顶点布局。
naga = { version = "30", features = ["wgsl-in"] }
