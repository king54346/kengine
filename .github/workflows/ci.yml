# 三道关：fmt → clippy（-D warnings）→ test，再确认基准编得过。
#
# 工具链版本由 rust-toolchain.toml 钉住，这里不另写版本号。
# 截图回归、要显卡的测试是 #[ignore]，CI 上不跑（没有 GPU、没有显示器）。
# `video` 特性（OpenH264，要 C 编译器）不在 --workspace 默认范围里，单独一步确认能编。

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI 上增量编译只占缓存、不省时间。
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 系统库（cpal → ALSA，gilrs → udev）
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 系统库（cpal → ALSA，gilrs → udev）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
      - run: cargo bench --workspace --no-run
      - name: video 特性编得过
        run: cargo build --example video_frame --features video
