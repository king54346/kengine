[workspace]
members = [
    "src/kcore",
    "src/kcore-derive",
    "src/klog",
    "src/kmath",
    "src/ktask",
]

[package]
name = "kengine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.3"
ktask = { path = "src/ktask" }
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"

