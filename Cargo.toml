[workspace]
exclude = ["third_party"]
members = [
    "src/kanim",
    "src/kapp",
    "src/kasset",
    "src/kaudio",
    "src/kcamera",
    "src/kcomponents",
    "src/kcore",
    "src/kcore-derive",
    "src/kinput",
    "src/klight",
    "src/klocale",
    "src/knav",
    "src/klog",
    "src/kfont",
    "src/kgizmo",
    "src/kgltf",
    "src/kmaterial",
    "src/kmesh",
    "src/kparticle",
    "src/kphysics",
    "src/kpbr",
    "src/krender",
    "src/kscene",
    "src/kwinit",
    "src/kmath",
    "src/kui",
    "src/kui_widgets",
    "src/kscript",
    "src/kshader",
    "src/ksprite",
    "src/ktask",
    "src/kterrain",
    "src/ktexture",
    "src/kimport",
    "src/kvideo",
    "src/kxunxian",
]

[package]
name = "kengine"
version = "0.1.0"
edition = "2024"

[features]
# 视频解码（kvideo 的 OpenH264 后端）。OpenH264 是 C++，要本机有 C/C++ 编译器，所以默认关：
# `cargo run --release --features video --example video_frame`。
video = ["kvideo/h264"]

[dependencies]
kanim = { path = "src/kanim" }
kcomponents = { path = "src/kcomponents" }
kapp = { path = "src/kapp" }
kasset = { path = "src/kasset" }
kaudio = { path = "src/kaudio" }
kcamera = { path = "src/kcamera" }
kcore = { path = "src/kcore" }
kfont = { path = "src/kfont" }
klocale = { path = "src/klocale" }
knav = { path = "src/knav" }
kgizmo = { path = "src/kgizmo" }
kgltf = { path = "src/kgltf" }
kinput = { path = "src/kinput" }
kimport = { path = "src/kimport" }
kvideo = { path = "src/kvideo" }
kxunxian = { path = "src/kxunxian" }
klight = { path = "src/klight" }
klog = { path = "src/klog" }
kmaterial = { path = "src/kmaterial" }
kmath = { path = "src/kmath" }
kmesh = { path = "src/kmesh" }
kparticle = { path = "src/kparticle" }
kphysics = { path = "src/kphysics" }
kpbr = { path = "src/kpbr" }
krender = { path = "src/krender" }
kscene = { path = "src/kscene" }
kscript = { path = "src/kscript" }
kshader = { path = "src/kshader" }
ksprite = { path = "src/ksprite" }
ktask = { path = "src/ktask" }
kterrain = { path = "src/kterrain" }
ktexture = { path = "src/ktexture" }
kui = { path = "src/kui" }
kui_widgets = { path = "src/kui_widgets" }
kwinit = { path = "src/kwinit" }
winit = "0.30.13"

[dev-dependencies]
# benches 用。criterion 做的两件事是手工掐表做不到的：跑到置信区间收窄，
# 以及把上一次的结果存下来做对比。
criterion = { version = "0.5", features = ["html_reports"] }
# GPU 粒子的例子要把每帧参数按 WGSL 的布局打成字节。
bytemuck = { version = "1.25.2", features = ["derive"] }
# render 基准与截图回归测试起无头渲染器（它是 async 的）。
pollster = "1.0.1"

# ── benches ──
# `harness = false` 是 criterion 的要求：它自带 main，不走 libtest。
[[bench]]
name = "scene"
harness = false

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "rendering_paths"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "script"
harness = false

[[bench]]
name = "render"
harness = false

# three.js 例子的 kengine 移植。放在 examples/kengine/ 下单独一个目录，
# 和引擎自己的例子分开——它们的目的不同：那些是「怎么用某个功能」，
# 这些是「对着一个成熟引擎的例子查自己缺什么」。
[[example]]
name = "backdrop_water"
path = "examples/kengine/backdrop_water.rs"

# 海洋演示：FFT 海浪、程序化天空、浮力、焦散、水下，全部来自 kcomponents。
# VFX 沙盒：ThreeJSVFX-Demo 移植（冰枪等技能，全程序化特效）。
