[workspace]
members = [
    "src/kanim",
    "src/kapp",
    "src/kasset",
    "src/kaudio",
    "src/kcamera",
    "src/kcore",
    "src/kcore-derive",
    "src/kinput",
    "src/klight",
    "src/klog",
    "src/kfont",
    "src/kgizmo",
    "src/kgltf",
    "src/kmaterial",
    "src/kmesh",
    "src/kparticle",
    "src/kphysics",
    "src/kpbr",
    "src/krender",
    "src/kscene",
    "src/kwinit",
    "src/kmath",
    "src/kscript",
    "src/kshader",
    "src/ksprite",
    "src/ktask",
    "src/ktexture",
]

[package]
name = "kengine"
version = "0.1.0"
edition = "2024"

[dependencies]
kanim = { path = "src/kanim" }
kapp = { path = "src/kapp" }
kasset = { path = "src/kasset" }
kaudio = { path = "src/kaudio" }
kcamera = { path = "src/kcamera" }
kcore = { path = "src/kcore" }
kfont = { path = "src/kfont" }
kgizmo = { path = "src/kgizmo" }
kgltf = { path = "src/kgltf" }
kinput = { path = "src/kinput" }
klight = { path = "src/klight" }
klog = { path = "src/klog" }
kmaterial = { path = "src/kmaterial" }
kmath = { path = "src/kmath" }
kmesh = { path = "src/kmesh" }
kparticle = { path = "src/kparticle" }
kphysics = { path = "src/kphysics" }
kpbr = { path = "src/kpbr" }
krender = { path = "src/krender" }
kscene = { path = "src/kscene" }
kscript = { path = "src/kscript" }
kshader = { path = "src/kshader" }
ksprite = { path = "src/ksprite" }
ktask = { path = "src/ktask" }
ktexture = { path = "src/ktexture" }
kwinit = { path = "src/kwinit" }
winit = "0.30.13"

[dev-dependencies]
# benches 用。criterion 做的两件事是手工掐表做不到的：跑到置信区间收窄，
# 以及把上一次的结果存下来做对比。
criterion = { version = "0.5", features = ["html_reports"] }

# ── benches ──
# `harness = false` 是 criterion 的要求：它自带 main，不走 libtest。
[[bench]]
name = "scene"
harness = false

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "rendering_paths"
harness = false

[[bench]]
name = "serialization"
harness = false
