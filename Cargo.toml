# texture2ddecoder 0.1.2（当时 crates.io 最新）的 BC6H 解码有移位溢出 bug，
# 用打过补丁的本地副本替换。详见 third_party/texture2ddecoder/Cargo.toml。
[patch.crates-io]
texture2ddecoder = { path = "third_party/texture2ddecoder" }

# ── dev 构建也优化依赖和物理 ──
#
# 不开的话 `cargo run --example physics_cloth`（不带 --release）一帧 190 ms：
# rapier、glam 这类数值密集的依赖在 opt-level 0 下慢几十倍，布料每帧
# 要做几十万次约束和近邻检查。依赖只在第一次编译时多花点时间，之后
# 几乎不再重编；kphysics 是工作区成员，`"*"` 管不到它，单独列出来。
# 断言和溢出检查照旧开着——只动优化级别，不动调试检查。
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.kphysics]
opt-level = 3

# 海面的 FFT 在 CPU 上做（三个级联、每帧几十万次复数运算）：opt-level 0 下一帧 37 ms，
# 开了 3 ms。渲染器、场景、动画每帧都要遍历上千个节点（water_island 里 140 条鱼的蒙皮、
# 几百棵海草），也一起开。不带 --release 跑 water_island 高画质从 20 帧到 80 帧。
[profile.dev.package.kcomponents]
opt-level = 3

[profile.dev.package.krender]
opt-level = 3

[profile.dev.package.kscene]
opt-level = 3

[profile.dev.package.kanim]
opt-level = 3

