[workspace]
members = [
    "src/kanim",
    "src/kapp",
    "src/kasset",
    "src/kaudio",
    "src/kcamera",
    "src/kcore",
    "src/kcore-derive",
    "src/kinput",
    "src/klight",
    "src/klog",
    "src/kfont",
    "src/kgizmo",
    "src/kgltf",
    "src/kmaterial",
    "src/kmesh",
    "src/kparticle",
    "src/kphysics",
    "src/kpbr",
    "src/krender",
    "src/kscene",
    "src/kwinit",
    "src/kmath",
    "src/kui",
    "src/kui_widgets",
    "src/kscript",
    "src/kshader",
    "src/ksprite",
    "src/ktask",
    "src/kterrain",
    "src/ktexture",
]

[package]
name = "kengine"
version = "0.1.0"
edition = "2024"

[dependencies]
kanim = { path = "src/kanim" }
kapp = { path = "src/kapp" }
kasset = { path = "src/kasset" }
kaudio = { path = "src/kaudio" }
kcamera = { path = "src/kcamera" }
kcore = { path = "src/kcore" }
kfont = { path = "src/kfont" }
kgizmo = { path = "src/kgizmo" }
kgltf = { path = "src/kgltf" }
kinput = { path = "src/kinput" }
klight = { path = "src/klight" }
klog = { path = "src/klog" }
kmaterial = { path = "src/kmaterial" }
kmath = { path = "src/kmath" }
kmesh = { path = "src/kmesh" }
kparticle = { path = "src/kparticle" }
kphysics = { path = "src/kphysics" }
kpbr = { path = "src/kpbr" }
krender = { path = "src/krender" }
kscene = { path = "src/kscene" }
kscript = { path = "src/kscript" }
kshader = { path = "src/kshader" }
ksprite = { path = "src/ksprite" }
ktask = { path = "src/ktask" }
kterrain = { path = "src/kterrain" }
ktexture = { path = "src/ktexture" }
kui = { path = "src/kui" }
kui_widgets = { path = "src/kui_widgets" }
kwinit = { path = "src/kwinit" }
winit = "0.30.13"

[dev-dependencies]
# benches 用。criterion 做的两件事是手工掐表做不到的：跑到置信区间收窄，
# 以及把上一次的结果存下来做对比。
criterion = { version = "0.5", features = ["html_reports"] }
# GPU 粒子的例子要把每帧参数按 WGSL 的布局打成字节。
bytemuck = { version = "1.25.2", features = ["derive"] }

# ── benches ──
# `harness = false` 是 criterion 的要求：它自带 main，不走 libtest。
[[bench]]
name = "scene"
harness = false

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "rendering_paths"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "script"
harness = false

# three.js 例子的 kengine 移植。放在 examples/kengine/ 下单独一个目录，
# 和引擎自己的例子分开——它们的目的不同：那些是「怎么用某个功能」，
# 这些是「对着一个成熟引擎的例子查自己缺什么」。
[[example]]
name = "backdrop_water"
path = "examples/kengine/backdrop_water.rs"

# 对象驱动的小游戏：Rust 摆场景、登记原型，玩法全在 scripts/ 的 JS 里。
[[example]]
name = "demo"
path = "examples/kengine/demo/main.rs"

# ── bevy 的 examples/gltf 移植 ──
# 用的是 bevy-main/assets/ 里的原始资源，两边画面能对着看。
[[example]]
name = "load_gltf"
path = "examples/kengine/gltf/load_gltf.rs"

